<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>joke site 🤪</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(-45deg, #0f0c20, #150734, #0b1b3d, #1f0b35);
            background-size: 400% 400%;
            animation: flow 15s ease infinite;
            overflow: hidden;
            text-align: center;
        }
        @keyframes flow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10, 5, 25, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .box {
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }
        .pulse {
            font-size: 1.8rem;
            font-weight: 700;
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(0.98); opacity: 0.6; text-shadow: 0 0 10px rgba(147, 51, 234, 0); }
            100% { transform: scale(1.02); opacity: 1; text-shadow: 0 0 20px rgba(147, 51, 234, 0.8); }
        }
        .card {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(168, 85, 247, 0.15);
            transform: translateY(20px);
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s;
        }
        body.ready .card { transform: translateY(0); opacity: 1; }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 25px;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .flex { display: flex; align-items: center; justify-content: center; gap: 15px; font-size: 1.2rem; color: #e2e8f0; }
        img {
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(192, 132, 252, 0.4);
            transition: transform 0.3s;
        }
        img:hover { transform: scale(1.1) rotate(5deg); }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="box">
            <div class="pulse">click me to enter</div>
        </div>
    </div>

    <div class="card">
        <h1 class="pulse">check the favicon its a femboys coke</h1>
        <div class="flex">
            <img src="favicon.png" width="64" height="67">
            <span>or whatever is this</span>
        </div>
    </div>

    <script>
        let ctx;
        const overlay = document.getElementById("overlay");
        
        window.addEventListener("click", () => {
            if (!ctx) {
                ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
                const size = 4096;
                const node = ctx.createScriptProcessor(size, 0, 1);
                
                let t = 0, T = 0, b = 1, last = 0;
                let a = Array(30720).fill(0);
                let l = 30720, n = 20480;
                const scale =;
                
                node.onaudioprocess = (e) => {
                    const out = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < size; i++) {
                        t++;
                        
                        if (t % n === 0) {
                            b = Math.min(2 ** ((scale[Math.floor(Math.random() * 8)] || 0) / 12), 100);
                        }
                        
                        T += b * .97 ** ((t / n / 2) % 1);
                        if (isNaN(T) || !isFinite(T)) T = 0;
                        
                        let idx = t % l;
                        a[idx] = (T) / 4 % 256 * (1 - (t / n) % 1) + (a[(t * 2) % l] || 0) * .75;
                        if (isNaN(a[idx])) a[idx] = 0;
                        
                        const fade = Math.min(t / 132300, 1);
                        last = (last * 0.85) + ((((a[idx] / 3) & 255) - 128) * 0.15);
                        
                        const drumT = t % (n * 2);
                        const drum = Math.sin(drumT * (Math.exp(-drumT / 4800) * 0.0625)) * 20 * Math.max(0, 1 - (drumT / (n * 1.8)));
                        
                        let mix = ((last * 0.35 * fade) + (drum * fade)) / 128;
                        out[i] = Math.max(-1, Math.min(1, mix));
                    }
                };
                node.connect(ctx.destination);
            }
            
            if (ctx.state === 'suspended') ctx.resume();
            document.body.classList.add("ready");
            overlay.style.opacity = "0";
            overlay.style.visibility = "hidden";
        });
    </script>
</body>
</html>
